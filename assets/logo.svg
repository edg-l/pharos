<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Pharos">
  <title>Pharos</title>
  <style>
    svg { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
  </style>

  <!-- Outer halo -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>

  <!-- Inner sacred-geometry ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Triangle: alchemical fire glyph -->
  <polygon points="128,40 50,206 206,206"
           fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>

  <!-- Compass-point stars between the rings -->
  <g fill="currentColor">
    <circle cx="128" cy="20" r="2.5"/>
    <circle cx="236" cy="128" r="2.5"/>
    <circle cx="128" cy="236" r="2.5"/>
    <circle cx="20" cy="128" r="2.5"/>
  </g>

  <!-- Sacred flame at the heart of the triangle -->
  <path d="M 128 86
           C 113 110, 113 132, 128 138
           C 143 132, 143 110, 128 86 Z"
        fill="currentColor"/>

  <!-- Faint horizon / distant sea lines under the triangle -->
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <line x1="74" y1="220" x2="182" y2="220" stroke-width="3" opacity="0.5"/>
    <line x1="86" y1="232" x2="170" y2="232" stroke-width="2" opacity="0.3"/>
  </g>
</svg>
