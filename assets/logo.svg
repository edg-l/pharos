<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Pharos">
  <title>Pharos</title>
  <style>
    svg { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
  </style>

  <!-- Light beams shooting out the top of the ball -->
  <g fill="currentColor">
    <polygon points="128,24 80,-6 98,-6" opacity="0.45"/>
    <polygon points="128,24 124,-14 132,-14" opacity="0.9"/>
    <polygon points="128,24 158,-6 176,-6" opacity="0.45"/>
  </g>

  <!-- Top hemisphere — subtle glow -->
  <path d="M 24 128 A 104 104 0 0 1 232 128 Z" fill="currentColor" opacity="0.10"/>

  <!-- Pokéball outline -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="currentColor" stroke-width="10"/>

  <!-- Lighthouse tower inside the bottom hemisphere, supporting the lantern button -->
  <g fill="currentColor">
    <!-- Upper tier (narrow, just under the equator) -->
    <polygon points="108,138 148,138 154,170 102,170"/>
    <!-- Lower tier (wider base) -->
    <polygon points="92,170 164,170 176,212 80,212"/>
  </g>

  <!-- Equator stripe (split around the button) -->
  <rect x="24" y="120" width="76" height="16" fill="currentColor"/>
  <rect x="156" y="120" width="76" height="16" fill="currentColor"/>

  <!-- Center button = lantern room; inner dot = beacon flame -->
  <circle cx="128" cy="128" r="28" fill="none" stroke="currentColor" stroke-width="10"/>
  <circle cx="128" cy="128" r="10" fill="currentColor"/>
</svg>
