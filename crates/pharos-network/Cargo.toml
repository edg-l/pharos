[package]
name = "pharos-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "libp2p + discv5 networking glue: gossip, req-resp, peer scoring."

[dependencies]
pharos-types.workspace = true
pharos-ssz.workspace = true
pharos-utils.workspace = true

libp2p = { workspace = true, features = [
    "tokio",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "gossipsub",
    "dns",
    "identify",
    "ping",
    "macros",
    "secp256k1",
    "request-response",
] }
discv5.workspace = true
tokio.workspace = true
snap.workspace = true
thiserror.workspace = true
tracing.workspace = true
metrics.workspace = true
futures.workspace = true
lru.workspace = true
sha2.workspace = true
sha3.workspace = true
arc-swap.workspace = true
async-trait = "0.1"
# EIP-1459 DNS bootnode resolution (M11 Phase 15).
hickory-resolver.workspace = true
k256.workspace = true
data-encoding.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
serial_test = "3"
criterion = { workspace = true }
tempfile.workspace = true

[[bench]]
name = "rpc_roundtrip"
harness = false
