[package]
name = "pharos-validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pharos validator-client binary."

[lib]
name = "pharos_validator"
path = "src/lib.rs"

[[bin]]
name = "pharos-vc"
path = "src/main.rs"

[dependencies]
# Internal crates
pharos-types.workspace = true
pharos-ssz.workspace = true
pharos-utils.workspace = true
pharos-stf.workspace = true

# HTTP client for BN
reqwest.workspace = true
url.workspace = true
tokio.workspace = true

# Slashing protection DB
rusqlite.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Observability / errors
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true

# EIP-2335 keystore crypto
aes.workspace = true
ctr.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
scrypt.workspace = true
sha2.workspace = true
subtle.workspace = true
unicode-normalization.workspace = true

clap.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json.workspace = true
