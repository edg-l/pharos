[package]
name = "pharos-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pharos beacon-node binary."

[[bin]]
name = "pharos"
path = "src/main.rs"

[dependencies]
pharos-api.workspace = true
pharos-engine.workspace = true
pharos-fork-choice.workspace = true
pharos-network.workspace = true
pharos-ssz.workspace = true
pharos-stf.workspace = true
pharos-storage.workspace = true
pharos-types.workspace = true
pharos-utils.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
hex.workspace = true
rand_core = { workspace = true }
libp2p.workspace = true
reqwest.workspace = true
clap = { version = "4", features = ["derive"] }
parking_lot.workspace = true
thiserror.workspace = true
lru.workspace = true
# async-trait is needed for PeerPicker, which is used as Arc<dyn PeerPicker>.
# dyn-safety requires the macro; BackfillBlockProvider uses native async-fn-in-trait
# (Rust 1.85 stable) because it is only used as a monomorphised generic, not dyn.
async-trait = "0.1"

[dev-dependencies]
axum.workspace = true
blst.workspace = true
criterion = { workspace = true }
jsonwebtoken.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serial_test.workspace = true
snap.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[[bench]]
name = "gossip_validation"
harness = false
