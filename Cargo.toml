[workspace]
resolver = "3"
members = [
    "crates/pharos-utils",
    "crates/pharos-ssz",
    "crates/pharos-ssz-derive",
    "crates/pharos-types",
    "crates/pharos-storage",
    "crates/pharos-fork-choice",
    "crates/pharos-stf",
    "crates/pharos-engine",
    "crates/pharos-network",
    "crates/pharos-api",
    "crates/pharos-node",
    "crates/pharos-validator",
    "crates/pharos-conformance",
    "crates/pharos-kzg",
]

[workspace.package]
version = "0.22.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["Edgar"]

[workspace.dependencies]
# Internal crates
pharos-utils = { path = "crates/pharos-utils" }
pharos-ssz = { path = "crates/pharos-ssz" }
pharos-ssz-derive = { path = "crates/pharos-ssz-derive" }
pharos-types = { path = "crates/pharos-types" }
pharos-storage = { path = "crates/pharos-storage" }
pharos-fork-choice = { path = "crates/pharos-fork-choice" }
pharos-stf = { path = "crates/pharos-stf" }
pharos-engine = { path = "crates/pharos-engine" }
pharos-network = { path = "crates/pharos-network" }
pharos-api = { path = "crates/pharos-api" }
pharos-node = { path = "crates/pharos-node" }
pharos-conformance = { path = "crates/pharos-conformance" }
pharos-kzg = { path = "crates/pharos-kzg" }

# Crypto (allowed exceptions: production primitives, no safe in-house alternative)
blst = "0.3"
c-kzg = "2"
sha2 = "0.11"
hex = "0.4"
rand_core = "0.9"
# Constant-time byte comparison (token / checksum equality, no timing side-channel).
subtle = "2"
# Zeroize secret key material on drop (JWT secret).
zeroize = "1"

# EIP-2335 keystore crypto (workspace-managed so version conflicts stay impossible)
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
hmac = "0.13"
pbkdf2 = "0.13"
scrypt = "0.12"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

# Async runtime / parallelism
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
rayon = "1"

# Networking
libp2p = "0.56"
discv5 = "0.10"
snap = "1"
futures = "0.3"
# EIP-1459 DNS bootnode resolution (in-house enrtree resolver, M11 Phase 15).
# hickory-resolver: async TXT lookups (already transitive via libp2p-dns).
# k256: secp256k1 ECDSA recovery for the enrtree-root signature.
# sha3: keccak256 for the signed-root content hash + subtree-hash check.
# data-encoding: base32 (RFC4648 no-pad) pubkey/hashes + url-safe base64 sig.
hickory-resolver = "0.25"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha3 = "0.10"
data-encoding = "2"

# HTTP
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "stream"] }
url = "2"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# Storage
rocksdb = "0.24"
rusqlite = { version = "0.39", features = ["bundled"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Concurrency
parking_lot = "0.12"
lru = "0.16"
arc-swap = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Testing
proptest = "1"
criterion = "0.8"
tempfile = "3"
serial_test = "3"
clap = { version = "4", features = ["derive"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"
panic = "abort"
overflow-checks = false

[profile.bench]
opt-level = 3
lto = "thin"
debug = true

# Optimized profile for the conformance walk (the slow `m0` suite). opt-level 3
# from release, but NO fat LTO / codegen-units=1 — those slow the build a lot
# and don't pay off for a one-shot run. Lives in its own target/conformance/
# tree so it never fingerprint-thrashes against release builds.
[profile.conformance]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
opt-level = 2
# line-tables-only: keeps file:line in panics/backtraces, drops variable/type
# DWARF. We debug logic via logs/tests, not gdb live-inspection.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# No debuginfo for dependencies; the dep tree (rocksdb, libp2p, blst, c-kzg,
# rustls) is the bulk of target/debug and we never step into it.
debug = false
